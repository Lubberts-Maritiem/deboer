<!doctype html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Marifoonbericht. Texel &amp; Harlingen</title>
<style>
  :root {
    --zee: #0b3d59;
    --zee-licht: #e8f1f5;
    --tekst: #142433;
  }
  body {
    margin: 0;
    padding: 2rem 1.25rem;
    background: var(--zee-licht);
    color: var(--tekst);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
  }
  main {
    max-width: 560px;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--zee);
    margin: 0 0 1rem;
  }
  .bericht {
    background: white;
    border-radius: 10px;
    padding: 1.1rem 1.25rem;
    margin-bottom: 0.75rem;
    box-shadow: 0 1px 3px rgba(11, 61, 89, 0.12);
    font-size: 1.05rem;
  }
  .status {
    color: #5a6b78;
    font-size: 0.9rem;
  }
  .getij-regel {
    font-weight: 600;
    color: var(--zee);
  }
  select#locatie {
    font: inherit;
    padding: 0.3rem 0.5rem;
    border-radius: 6px;
    border: 1px solid #b9cdd8;
    background: white;
    color: var(--tekst);
    margin-bottom: 1rem;
  }
  label[for="locatie"] {
    font-size: 0.9rem;
    color: #5a6b78;
    margin-right: 0.5rem;
  }
  .acties {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1rem;
  }
  button#kopieer {
    font: inherit;
    font-size: 0.95rem;
    padding: 0.45rem 0.9rem;
    border-radius: 6px;
    border: 1px solid var(--zee);
    background: var(--zee);
    color: white;
    cursor: pointer;
  }
  button#kopieer:hover:not(:disabled) {
    background: #145a80;
  }
  button#kopieer:focus-visible {
    outline: 3px solid #7fb3cc;
    outline-offset: 2px;
  }
  button#kopieer:disabled {
    opacity: 0.5;
    cursor: default;
  }
  #kopieer-status {
    font-size: 0.9rem;
    color: #5a6b78;
  }
</style>
</head>
<body>
<main>
  <h1>Marifoonbericht, sector Texel &amp; Harlingen</h1>
  <div id="inhoud" class="status">Bezig met laden...</div>

  <div class="acties">
    <button id="kopieer" type="button" disabled>Kopieer bericht en getij</button>
    <span id="kopieer-status" role="status" aria-live="polite"></span>
  </div>

  <div>
    <label for="locatie">Getij bij:</label>
    <select id="locatie">
      <option value="denhelder">Den Helder</option>
      <option value="denoever">Den Oever</option>
      <option value="texel" selected>Texel</option>
      <option value="harlingen">Harlingen</option>
      <option value="vlieland">Vlieland</option>
      <option value="terschelling">Terschelling</option>
      <option value="ameland">Ameland</option>
      <option value="holwerd">Holwerd</option>
      <option value="schiermonnikoog">Schiermonnikoog</option>
      <option value="lauwersoog">Lauwersoog</option>
      <option value="delfzijl">Delfzijl</option>
    </select>
  </div>
</main>

<script>
function formatTijd(iso) {
  if (!iso) return "onbekend";
  const d = new Date(iso);
  return d.toLocaleString("nl-NL", {
    weekday: "short",
    hour: "2-digit",
    minute: "2-digit",
  });
}

function formatCm(cm) {
  // Verwachte hoogte t.o.v. NAP, met teken. Leeg als er geen waarde is.
  if (cm == null || !Number.isFinite(cm)) return "";
  const teken = cm > 0 ? "+" : cm < 0 ? "\u2212" : "";
  return ` (${teken}${Math.abs(cm)} cm)`;
}

async function laadAlles() {
  const el = document.getElementById("inhoud");
  const locatie = document.getElementById("locatie").value;

  try {
    const [marifoonRes, getijRes] = await Promise.all([
      fetch(`/api/marifoon?locatie=${encodeURIComponent(locatie)}`),
      fetch(`/api/getij?locatie=${encodeURIComponent(locatie)}`),
    ]);
    const marifoon = await marifoonRes.json();
    const getij = await getijRes.json();

    if (marifoon.error) throw new Error(marifoon.error);

    el.innerHTML = "";
    el.className = "";

    if (!marifoon.tekst) {
      const p = document.createElement("p");
      p.className = "status";
      p.textContent = "Geen actueel marifoonbericht beschikbaar.";
      el.appendChild(p);
    } else {
      const p = document.createElement("p");
      p.className = "bericht";
      p.textContent = marifoon.tekst;
      el.appendChild(p);
    }

    // Getijregel achteraan, voor de gekozen locatie. De eerstvolgende twee
    // extremen in de volgorde waarin ze komen: soms LW dan HW, soms andersom.
    const getijP = document.createElement("p");
    getijP.className = "bericht getij-regel";
    if (getij.error) {
      getijP.textContent = "Getijgegevens niet beschikbaar.";
    } else {
      const komende = getij.komende?.length
        ? getij.komende
        : [getij.volgendLaagwater, getij.volgendHoogwater]
            .filter(Boolean)
            .sort((a, b) => new Date(a.tijdstip) - new Date(b.tijdstip));
      const delen = komende.map((e) => {
        const label = e.type === "hoogwater" ? "HW" : "LW";
        return `${label}: ${formatTijd(e.tijdstip)}${formatCm(e.waardeCm)}`;
      });
      getijP.textContent = delen.length
        ? `${getij.locatie}, ${delen.join(", ")}`
        : `${getij.locatie}, geen komende getijden bekend.`;
    }
    el.appendChild(getijP);
    document.getElementById("kopieer").disabled = false;
  } catch (err) {
    document.getElementById("kopieer").disabled = true;
    el.className = "status";
    el.textContent = "Kon de gegevens niet ophalen.";
    console.error(err);
  }
}

async function kopieerAlles() {
  // Marifoonbericht en getijregel in één keer, gescheiden door een witregel.
  const status = document.getElementById("kopieer-status");
  const regels = [...document.querySelectorAll("#inhoud p")]
    .map((p) => p.textContent.trim())
    .filter(Boolean);
  if (!regels.length) return;
  const tekst = regels.join("\n\n");

  try {
    await navigator.clipboard.writeText(tekst);
  } catch {
    // Terugval voor browsers of pagina's zonder Clipboard API (bijv. http).
    const veld = document.createElement("textarea");
    veld.value = tekst;
    veld.setAttribute("readonly", "");
    veld.style.position = "fixed";
    veld.style.opacity = "0";
    document.body.appendChild(veld);
    veld.select();
    const gelukt = document.execCommand("copy");
    veld.remove();
    if (!gelukt) {
      status.textContent = "Kopiëren lukte niet. Selecteer de tekst handmatig.";
      return;
    }
  }
  status.textContent = "Gekopieerd";
  clearTimeout(kopieerAlles.timer);
  kopieerAlles.timer = setTimeout(() => (status.textContent = ""), 2500);
}

document.getElementById("kopieer").addEventListener("click", kopieerAlles);
document.getElementById("locatie").addEventListener("change", laadAlles);
laadAlles();
setInterval(laadAlles, 15 * 60 * 1000); // elke 15 minuten verversen
</script>
</body>
</html>
