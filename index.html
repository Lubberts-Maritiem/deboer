<script>
// ---------- Dag- en nachtweergave ----------
// Standaard automatisch: overdag de gewone weergave, na zonsondergang de
// donkere. Met het knopje rechtsboven kies je zelf: auto, dag, nacht of
// rood (brugscherm, spaart je nachtzicht). De keuze wordt onthouden.
// Zon op en onder worden berekend voor de westelijke Waddenzee.
const ZON_LAT = 53.17;
const ZON_LON = 5.3;

function zonTijden(datum, lat, lon) {
  // "Sunrise equation" (NOAA-benadering), nauwkeurig op een minuut of twee.
  const rad = Math.PI / 180;
  const dagMs = 86400000;
  const J = datum.getTime() / dagMs + 2440587.5;
  const n = Math.round(J - 2451545.0 + 0.0008 - lon / 360);
  const Js = n - lon / 360;
  const M = (357.5291 + 0.98560028 * Js) % 360;
  const C = 1.9148 * Math.sin(M * rad) + 0.02 * Math.sin(2 * M * rad) + 0.0003 * Math.sin(3 * M * rad);
  const L = (M + C + 180 + 102.9372) % 360;
  const Jt = 2451545.0 + Js + 0.0053 * Math.sin(M * rad) - 0.0069 * Math.sin(2 * L * rad);
  const sinD = Math.sin(L * rad) * Math.sin(23.4397 * rad);
  const cosD = Math.cos(Math.asin(sinD));
  const cosW = (Math.sin(-0.833 * rad) - Math.sin(lat * rad) * sinD) / (Math.cos(lat * rad) * cosD);
  const W = Math.acos(Math.min(1, Math.max(-1, cosW))) / rad;
  const naarDate = (j) => new Date((j - 2440587.5) * dagMs);
  return { op: naarDate(Jt - W / 360), onder: naarDate(Jt + W / 360) };
}

function isNacht(nu = new Date()) {
  // Rekenen vanaf 12:00 UTC op de Nederlandse kalenderdag. Anders valt een
  // tijdstip vroeg in de ochtend in de berekening van de volgende dag.
  const [j, m, d] = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Europe/Amsterdam", year: "numeric", month: "2-digit", day: "2-digit",
  }).format(nu).split("-").map(Number);
  const { op, onder } = zonTijden(new Date(Date.UTC(j, m - 1, d, 12)), ZON_LAT, ZON_LON);
  return nu < op || nu >= onder;
}

function leesThemaKeuze() {
  try { return localStorage.getItem("thema") || "auto"; } catch { return "auto"; }
}

function pasThemaToe() {
  const keuze = leesThemaKeuze();
  const thema = keuze === "auto" ? (isNacht() ? "nacht" : "dag") : keuze;
  document.documentElement.dataset.thema = thema;
  document.documentElement.dataset.themaKeuze = keuze;
  return { keuze, thema };
}

pasThemaToe();
</script>

<script>
function formatTijd(iso) {
  if (!iso) return "onbekend";
  const d = new Date(iso);
  return d.toLocaleString("nl-NL", {
    weekday: "short",
    hour: "2-digit",
    minute: "2-digit",
  });
}

function formatCm(cm) {
  // Verwachte hoogte t.o.v. NAP, met teken. Leeg als er geen waarde is.
  if (cm == null || !Number.isFinite(cm)) return "";
  const teken = cm > 0 ? "+" : cm < 0 ? "−" : "";
  return ` (${teken}${Math.abs(cm)} cm)`;
}

// ---------- Ophalen met offline-geheugen ----------
// Elk geslaagd antwoord van een API wordt in de browser bewaard. Lukt
// ophalen niet (geen bereik, storing), dan tonen we de bewaarde versie en
// zegt de regel "Bijgewerkt" hoe oud die is. Bij het openen van de pagina
// staat de bewaarde versie er meteen, ook voordat het netwerk antwoordt.

const CACHE_PREFIX = "cache:";
const FETCH_TIMEOUT_MS = 10000;
const MAX_LEEFTIJD_STANDEN_MS = 60 * 60 * 1000; // oudere standen niet als actueel tonen

// Per onderdeel: van welke URL de getoonde gegevens komen, hoe oud ze zijn en
// of ze uit het geheugen komen. Voedt de regel "Bijgewerkt".
const bronStatus = {};
// Volgnummer per onderdeel, zodat een traag antwoord van een vorige
// meetlocatie een nieuwer antwoord niet overschrijft.
const volgnummer = {};

function leesCache(url) {
  try {
    const ruw = localStorage.getItem(CACHE_PREFIX + url);
    return ruw ? JSON.parse(ruw) : null;
  } catch {
    return null;
  }
}

function schrijfCache(url, data) {
  try {
    localStorage.setItem(CACHE_PREFIX + url, JSON.stringify({ tijd: Date.now(), data }));
  } catch {}
}

async function haalJson(url) {
  let fout = new Error("geen verbinding");
  if (navigator.onLine !== false) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), FETCH_TIMEOUT_MS);
    try {
      const res = await fetch(url, { signal: ctrl.signal });
      if (res.status === 404) throw new Error(`${url} niet gevonden op de server`);
      const data = await res.json().catch(() => {
        throw new Error(`geen JSON van ${url} (status ${res.status})`);
      });
      if (!res.ok || data.error) throw new Error(data.detail || data.error || `status ${res.status}`);
      schrijfCache(url, data);
      return { data, tijd: Date.now(), uitCache: false };
    } catch (err) {
      fout = err.name === "AbortError" ? new Error("geen antwoord binnen 10 s") : err;
    } finally {
      clearTimeout(timer);
    }
  }
  const bewaard = leesCache(url);
  if (bewaard) return { data: bewaard.data, tijd: bewaard.tijd, uitCache: true, fout };
  throw fout;
}

async function laadBron(sleutel, url, toon, toonFout) {
  const nr = (volgnummer[sleutel] = (volgnummer[sleutel] || 0) + 1);
  const actueel = () => volgnummer[sleutel] === nr;

  // Nieuwe URL (eerste keer, of andere meetlocatie): eerst meteen de
  // bewaarde versie tonen, zodat het scherm nooit leeg is.
  if (bronStatus[sleutel]?.url !== url) {
    const bewaard = leesCache(url);
    if (bewaard) {
      toon(bewaard.data, bewaard.tijd);
      bronStatus[sleutel] = { url, tijd: bewaard.tijd, uitCache: true };
      werkBijgewerktBij();
    }
  }

  try {
    const r = await haalJson(url);
    if (!actueel()) return;
    toon(r.data, r.tijd);
    bronStatus[sleutel] = { url, tijd: r.tijd, uitCache: r.uitCache };
    if (r.fout) console.warn(`${sleutel}: bewaarde versie getoond,`, r.fout.message);
  } catch (err) {
    if (!actueel()) return;
    console.error(`${sleutel}:`, err);
    // Staat er al iets voor deze URL, laat dat dan staan.
    if (bronStatus[sleutel]?.url !== url) {
      toonFout(err);
      bronStatus[sleutel] = { url, tijd: null, uitCache: false };
    } else {
      bronStatus[sleutel].uitCache = true;
    }
  }
  werkBijgewerktBij();
}

// ---------- Marifoonbericht en getij ----------
// Twee losse onderdelen: als het ene faalt, blijft het andere gewoon staan.

function toonBericht(marifoon) {
  const p = document.getElementById("bericht");
  if (marifoon.tekst) {
    p.className = "bericht";
    p.textContent = marifoon.tekst;
  } else {
    p.className = "status";
    p.textContent = "Geen actueel marifoonbericht beschikbaar.";
  }
  werkKopieerknopBij();
}

function toonBerichtFout(err) {
  const p = document.getElementById("bericht");
  p.className = "status";
  p.textContent = `Marifoonbericht niet beschikbaar (${err.message}).`;
  werkKopieerknopBij();
}

function toonGetij(getij) {
  // De eerstvolgende twee extremen in de volgorde waarin ze komen: soms LW
  // dan HW, soms andersom. We rekenen "eerstvolgend" opnieuw uit vanaf nu,
  // zodat een bewaarde versie offline ook uren later nog klopt.
  const p = document.getElementById("getijregel");
  const nu = Date.now();
  let komende = (getij.extremen || [])
    .filter((e) => new Date(e.tijdstip).getTime() >= nu)
    .sort((a, b) => new Date(a.tijdstip) - new Date(b.tijdstip))
    .slice(0, 2);
  if (!komende.length) {
    komende = (getij.komende || [getij.volgendLaagwater, getij.volgendHoogwater])
      .filter((e) => e && new Date(e.tijdstip).getTime() >= nu)
      .sort((a, b) => new Date(a.tijdstip) - new Date(b.tijdstip));
  }
  const delen = komende.map((e) => {
    const label = e.type === "hoogwater" ? "HW" : "LW";
    return `${label}: ${formatTijd(e.tijdstip)}${formatCm(e.waardeCm)}`;
  });
  p.textContent = delen.length
    ? `${getij.locatie}, ${delen.join(", ")}`
    : `${getij.locatie}, geen komende getijden bekend.`;
  p.hidden = false;
  werkKopieerknopBij();
}

function toonGetijFout(err) {
  const p = document.getElementById("getijregel");
  p.textContent = `Getijgegevens niet beschikbaar (${err.message}).`;
  p.hidden = false;
  werkKopieerknopBij();
}

function laadAlles() {
  const locatie = encodeURIComponent(document.getElementById("locatie").value);
  laadBron("bericht", `/api/marifoon?locatie=${locatie}`, toonBericht, toonBerichtFout);
  laadBron("getij", `/api/getij?locatie=${locatie}`, toonGetij, toonGetijFout);
}

function werkKopieerknopBij() {
  const iets = document.getElementById("bericht").classList.contains("bericht")
    || !document.getElementById("getijregel").hidden;
  document.getElementById("kopieer").disabled = !iets;
}

async function kopieerAlles() {
  // Marifoonbericht en getijregel in één keer, gescheiden door een witregel.
  const status = document.getElementById("kopieer-status");
  const regels = [...document.querySelectorAll("#inhoud p")]
    .filter((p) => !p.hidden)
    .map((p) => p.textContent.trim())
    .filter(Boolean);
  if (!regels.length) return;
  const tekst = regels.join("\n\n");

  try {
    await navigator.clipboard.writeText(tekst);
  } catch {
    // Terugval voor browsers of pagina's zonder Clipboard API (bijv. http).
    const veld = document.createElement("textarea");
    veld.value = tekst;
    veld.setAttribute("readonly", "");
    veld.style.position = "fixed";
    veld.style.opacity = "0";
    document.body.appendChild(veld);
    veld.select();
    const gelukt = document.execCommand("copy");
    veld.remove();
    if (!gelukt) {
      status.textContent = "Kopiëren lukte niet. Selecteer de tekst handmatig.";
      return;
    }
  }
  status.textContent = "Gekopieerd";
  clearTimeout(kopieerAlles.timer);
  kopieerAlles.timer = setTimeout(() => (status.textContent = ""), 2500);
}

// ---------- NAP West-Terschelling +50 cm ----------

function toonDrempel(d) {
  const el = document.getElementById("drempel");
  const kop = `<strong>NAP ${d.locatie} +${d.niveauCm} cm</strong>`;
  const nu = Date.now();
  const komende = (d.komende || []).filter((k) => new Date(k.tijdstip).getTime() >= nu);
  if (komende.length) {
    el.innerHTML = `${kop}: ${komende.map((k) => `${k.richting} ${formatTijd(k.tijdstip)}`).join(", ")}`;
  } else if (d.komende?.length) {
    // Alle bewaarde momenten liggen al achter ons (offline).
    el.innerHTML = `${kop}: geen actuele verwachting.`;
  } else {
    el.innerHTML = `${kop}: ${d.nuBoven ? "blijft erboven" : "wordt niet gehaald"} binnen de verwachting.`;
  }
}

function toonDrempelFout(err) {
  document.getElementById("drempel").textContent =
    `NAP West-Terschelling +50 cm: niet beschikbaar (${err.message}).`;
}

function laadDrempel() {
  laadBron("drempel", "/api/drempel", toonDrempel, toonDrempelFout);
}

// ---------- Rollende balk met waterstanden ----------

function toonWaterstanden(d, tijd) {
  // Liever geen balk dan een verouderde balk: bewaarde standen van langer
  // dan een uur geleden tonen we niet.
  const balk = document.getElementById("ticker");
  const band = document.getElementById("ticker-band");
  if (!d.locaties?.length || Date.now() - tijd > MAX_LEEFTIJD_STANDEN_MS) {
    balk.hidden = true;
    return;
  }

  const reeks = document.createDocumentFragment();
  for (const l of d.locaties) {
    const item = document.createElement("span");
    item.className = "ticker-item";
    const naam = document.createElement("b");
    naam.textContent = l.naam;
    item.appendChild(naam);

    const stand = document.createElement("span");
    if (l.waardeCm == null) {
      stand.className = "geen";
      stand.textContent = "N/A";
    } else {
      const teken = l.waardeCm > 0 ? "+" : l.waardeCm < 0 ? "−" : "";
      stand.textContent = `${teken}${Math.abs(l.waardeCm)} cm`;
    }
    item.appendChild(stand);

    if (l.waardeCm != null && l.richting) {
      const pijl = document.createElement("span");
      pijl.className = "pijl";
      pijl.textContent = l.richting === "stijgend" ? "▲" : "▼";
      pijl.title = l.richting;
      item.appendChild(pijl);
    }
    reeks.appendChild(item);

    const icoon = document.createElement("img");
    icoon.className = "ticker-icoon";
    icoon.src = "https://www.dutchdredging.nl/media/beeldmerk/small/50x50/beeldmerk.png";
    icoon.alt = "";
    reeks.appendChild(icoon);
  }

  // Alleen opnieuw opbouwen als er echt iets veranderd is, anders springt
  // het rollen terug naar het begin.
  const vingerafdruk = JSON.stringify(d.locaties.map((l) => [l.naam, l.waardeCm, l.richting]));
  if (vingerafdruk !== band.dataset.vingerafdruk) {
    band.dataset.vingerafdruk = vingerafdruk;
    band.replaceChildren(reeks.cloneNode(true), reeks);
  }
  balk.hidden = false;
  // Gelijke snelheid ongeacht schermbreedte: ongeveer 50 pixels per seconde.
  requestAnimationFrame(() => {
    band.style.setProperty("--duur", `${Math.max(20, band.scrollWidth / 2 / 50)}s`);
  });
}

function toonWaterstandenFout() {
  document.getElementById("ticker").hidden = true;
}

function laadWaterstanden() {
  laadBron("waterstanden", "/api/waterstanden", toonWaterstanden, toonWaterstandenFout);
}

// ---------- Regel "Bijgewerkt" ----------
// Toont wanneer de gegevens op het scherm zijn opgehaald. Grijs als alles
// vers is, oranje als er iets uit het geheugen komt of ouder is dan 25 minuten.

const OUD_NA_MS = 25 * 60 * 1000;

function klokTijd(ms) {
  const d = new Date(ms);
  const vandaag = new Date().toDateString() === d.toDateString();
  return d.toLocaleString("nl-NL", vandaag
    ? { hour: "2-digit", minute: "2-digit" }
    : { weekday: "short", hour: "2-digit", minute: "2-digit" });
}

function duurTekst(ms) {
  const min = Math.round(ms / 60000);
  if (min < 1) return "zojuist";
  if (min < 60) return `${min} min geleden`;
  const uur = Math.floor(min / 60);
  return uur < 24 ? `${uur} uur geleden` : `${Math.floor(uur / 24)} dag geleden`;
}

function werkBijgewerktBij() {
  const el = document.getElementById("bijgewerkt");
  const bronnen = Object.values(bronStatus).filter((b) => b.tijd);
  if (!bronnen.length) {
    el.textContent = navigator.onLine === false ? "Geen verbinding en nog geen bewaarde gegevens." : "";
    el.classList.toggle("oud", navigator.onLine === false);
    return;
  }
  const oudste = Math.min(...bronnen.map((b) => b.tijd));
  const leeftijd = Date.now() - oudste;
  const uitCache = bronnen.some((b) => b.uitCache);
  const offline = navigator.onLine === false;

  let tekst;
  if (offline) {
    tekst = `Geen verbinding. Gegevens van ${klokTijd(oudste)} (${duurTekst(leeftijd)}).`;
  } else if (uitCache || leeftijd > OUD_NA_MS) {
    tekst = `Verversen lukt niet. Gegevens van ${klokTijd(oudste)} (${duurTekst(leeftijd)}).`;
  } else {
    tekst = `Bijgewerkt ${klokTijd(oudste)}`;
  }
  el.textContent = tekst;
  el.title = "Tijdstip waarop deze pagina de gegevens heeft opgehaald";
  el.classList.toggle("oud", offline || uitCache || leeftijd > OUD_NA_MS);
}

// ---------- Themaknop ----------
const THEMA_VOLGORDE = ["auto", "dag", "nacht", "rood"];
const THEMA_LABEL = { dag: "☀ Dag", nacht: "☾ Nacht", rood: "● Rood brug" };

function toonThemaKnop() {
  const { keuze, thema } = pasThemaToe();
  const knop = document.getElementById("thema");
  knop.textContent = keuze === "auto" ? `Auto · ${thema === "nacht" ? "nacht" : "dag"}` : THEMA_LABEL[keuze];
  knop.title = "Wissel tussen automatisch, dag, nacht en rood brugscherm";
}

document.getElementById("thema").addEventListener("click", () => {
  const huidig = leesThemaKeuze();
  const volgende = THEMA_VOLGORDE[(THEMA_VOLGORDE.indexOf(huidig) + 1) % THEMA_VOLGORDE.length];
  try { localStorage.setItem("thema", volgende); } catch {}
  toonThemaKnop();
});

document.getElementById("kopieer").addEventListener("click", kopieerAlles);

// Elke minuut: thema volgens de zon en leeftijd in "Bijgewerkt".
setInterval(() => {
  toonThemaKnop();
  werkBijgewerktBij();
}, 60 * 1000);
toonThemaKnop();

// ---------- Automatisch verversen ----------
// Gegevens: elke 10 minuten, zonder de pagina te herladen. Dat is het ritme
// waarin waddendata en onze API-cache vernieuwen; vaker heeft geen zin.
// Browsers vertragen timers in een tabblad op de achtergrond of tijdens
// slaapstand. Daarom verversen we ook meteen als je terugkomt op de pagina
// en de laatste keer langer dan 2 minuten geleden is.
// Daarnaast herlaadt de hele pagina elke 10 minuten, zodat een nieuwe versie
// van je site vanzelf binnenkomt. Zonder verbinding slaan we dat over, zodat
// je geen foutpagina krijgt. De gekozen locatie blijft bewaard.

const VERVERS_MS = 10 * 60 * 1000;
const TERUGKOMST_MS = 2 * 60 * 1000;
const HERLAAD_MS = 10 * 60 * 1000 - 30 * 1000; // 10 minuten, met een halve minuut marge voor timers die net te vroeg afgaan
const geladenOp = Date.now();
let laatsteVerversing = 0;

function ververs() {
  laatsteVerversing = Date.now();
  laadAlles();
  laadDrempel();
  laadWaterstanden();
}

function magHerladen() {
  return Date.now() - geladenOp > HERLAAD_MS && navigator.onLine !== false;
}

function bewaarLocatie() {
  try { localStorage.setItem("getijLocatie", document.getElementById("locatie").value); } catch {}
}

function herstelLocatie() {
  try {
    const opgeslagen = localStorage.getItem("getijLocatie");
    const select = document.getElementById("locatie");
    if (opgeslagen && [...select.options].some((o) => o.value === opgeslagen)) {
      select.value = opgeslagen;
    }
  } catch {}
}

document.getElementById("locatie").addEventListener("change", () => {
  bewaarLocatie();
  laadAlles();
});

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  if (magHerladen()) return location.reload();
  if (Date.now() - laatsteVerversing > TERUGKOMST_MS) ververs();
});

// Verbinding terug: meteen verversen. Verbinding weg: regel bijwerken.
window.addEventListener("online", ververs);
window.addEventListener("offline", werkBijgewerktBij);

setInterval(() => {
  // Volledig herladen alleen als de pagina zichtbaar is; anders gebeurt het
  // bij terugkomst via visibilitychange.
  if (magHerladen() && document.visibilityState === "visible") {
    return location.reload();
  }
  ververs();
}, VERVERS_MS);

// Service worker: bewaart de pagina zelf, zodat hij ook zonder bereik opent.
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js").catch((err) => console.warn("Service worker:", err));
}

herstelLocatie();
ververs();
</script>
