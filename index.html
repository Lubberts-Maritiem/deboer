<!doctype html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Marifoonbericht. Texel &amp; Harlingen</title>
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="alternate" type="application/rss+xml" title="Marifoonbericht en getij" href="/api/rss" />
<style>
  :root {
    --zee: #0b3d59;
    --zee-licht: #e8f1f5;
    --tekst: #142433;
  }
  body {
    margin: 0;
    padding: 2rem 1.25rem;
    background: var(--zee-licht);
    color: var(--tekst);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
    min-height: 100vh;
    box-sizing: border-box;
  }
  /* Foto van de haven van West-Terschelling als subtiele achtergrond:
     vast op zijn plek, licht wazig en grotendeels doorzichtig, zodat de
     lichtblauwe kleur erdoorheen blijft en de tekst goed leesbaar is.
     De negatieve inset voorkomt lichte randen door de blur. */
  body::before {
    content: "";
    position: fixed;
    inset: -20px;
    z-index: -1;
    background: url("https://www.dutchdredging.nl/media/etna-waddenzee-01/content_image_large/61x59/etna-waddenzee-01.jpg") center / cover no-repeat;
    filter: blur(3px);
    opacity: 0.35;
    pointer-events: none;
  }
  main {
    max-width: 560px;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--zee);
    margin: 0 0 1rem;
  }
  .bericht {
    background: white;
    border-radius: 10px;
    padding: 1.1rem 1.25rem;
    margin-bottom: 0.75rem;
    box-shadow: 0 1px 3px rgba(11, 61, 89, 0.12);
    font-size: 1.05rem;
  }
  .status {
    color: #5a6b78;
    font-size: 0.9rem;
  }
  .getij-regel {
    font-weight: 600;
    color: var(--zee);
  }
  select#locatie {
    font: inherit;
    padding: 0.3rem 0.5rem;
    border-radius: 6px;
    border: 1px solid #b9cdd8;
    background: white;
    color: var(--tekst);
    margin-bottom: 1rem;
  }
  label[for="locatie"] {
    font-size: 0.9rem;
    color: var(--tekst);
    margin-right: 0.5rem;
  }
  .acties {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1rem;
  }
  button#kopieer {
    font: inherit;
    font-size: 0.95rem;
    padding: 0.45rem 0.9rem;
    border-radius: 6px;
    border: 1px solid var(--zee);
    background: var(--zee);
    color: white;
    cursor: pointer;
  }
  button#kopieer:hover:not(:disabled) {
    background: #145a80;
  }
  button#kopieer:focus-visible {
    outline: 3px solid #7fb3cc;
    outline-offset: 2px;
  }
  button#kopieer:disabled {
    opacity: 0.5;
    cursor: default;
  }
  #kopieer-status {
    font-size: 0.9rem;
    color: var(--tekst);
  }
  .drempel {
    font-size: 0.85rem;
    color: #5a6b78;
    background: white;
    border-left: 3px solid var(--zee);
    border-radius: 6px;
    padding: 0.5rem 0.75rem;
    margin-bottom: 1rem;
  }
  .drempel strong {
    color: var(--zee);
    font-weight: 600;
  }
  .ticker {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    background: #024f92; /* het blauw uit het beeldmerk van De Boer */
    color: white;
    font-size: 0.9rem;
    overflow: hidden;
    white-space: nowrap;
    padding: 0.5rem 0;
  }
  .ticker-band {
    display: inline-flex;
    align-items: center;
    animation: rol var(--duur, 60s) linear infinite;
  }
  .ticker:hover .ticker-band {
    animation-play-state: paused;
  }
  .ticker-item {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
  }
  .ticker-item b {
    font-weight: 600;
  }
  .ticker-item .pijl {
    color: #9fd3ec;
    font-size: 0.75rem;
  }
  .ticker-item .geen {
    color: #b9cdd8;
  }
  .ticker-icoon {
    height: 0.8rem;
    width: auto;
    margin: 0 1.8rem;
    vertical-align: middle;
  }
  @keyframes rol {
    to { transform: translateX(-50%); }
  }
  @media (prefers-reduced-motion: reduce) {
    .ticker { overflow-x: auto; }
    .ticker-band { animation: none; }
  }
  /* Ruimte onderaan, zodat de balk geen inhoud bedekt. */
  body { padding-bottom: 4rem; }
</style>
</head>
<body>
<main>
  <div>
    <label for="locatie">Meetlocatie:</label>
    <select id="locatie">
      <option value="denhelder">Den Helder</option>
      <option value="denoever">Den Oever</option>
      <option value="texel">Texel</option>
      <option value="harlingen" selected>Harlingen</option>
      <option value="vlieland">Vlieland</option>
      <option value="terschelling">Terschelling</option>
      <option value="ameland">Ameland</option>
      <option value="holwerd">Holwerd</option>
      <option value="schiermonnikoog">Schiermonnikoog</option>
      <option value="lauwersoog">Lauwersoog</option>
      <option value="delfzijl">Delfzijl</option>
    </select>
  </div>

  <div id="inhoud" class="status">Bezig met laden...</div>

  <div class="acties">
    <button id="kopieer" type="button" disabled>Kopieer bericht en getij</button>
    <span id="kopieer-status" role="status" aria-live="polite"></span>
  </div>


  <div id="drempel" class="drempel">NAP West-Terschelling +50 cm wordt geladen...</div>
</main>

<div class="ticker" id="ticker" role="region" aria-label="Actuele waterstanden" hidden>
  <div class="ticker-band" id="ticker-band"></div>
</div>

<script>
function formatTijd(iso) {
  if (!iso) return "onbekend";
  const d = new Date(iso);
  return d.toLocaleString("nl-NL", {
    weekday: "short",
    hour: "2-digit",
    minute: "2-digit",
  });
}

function formatCm(cm) {
  // Verwachte hoogte t.o.v. NAP, met teken. Leeg als er geen waarde is.
  if (cm == null || !Number.isFinite(cm)) return "";
  const teken = cm > 0 ? "+" : cm < 0 ? "\u2212" : "";
  return ` (${teken}${Math.abs(cm)} cm)`;
}

async function laadAlles() {
  const el = document.getElementById("inhoud");
  const locatie = document.getElementById("locatie").value;

  try {
    const [marifoonRes, getijRes] = await Promise.all([
      fetch(`/api/marifoon?locatie=${encodeURIComponent(locatie)}`),
      fetch(`/api/getij?locatie=${encodeURIComponent(locatie)}`),
    ]);
    const marifoon = await marifoonRes.json();
    const getij = await getijRes.json();

    if (marifoon.error) throw new Error(marifoon.error);

    el.innerHTML = "";
    el.className = "";

    if (!marifoon.tekst) {
      const p = document.createElement("p");
      p.className = "status";
      p.textContent = "Geen actueel marifoonbericht beschikbaar.";
      el.appendChild(p);
    } else {
      const p = document.createElement("p");
      p.className = "bericht";
      p.textContent = marifoon.tekst;
      el.appendChild(p);
    }

    // Getijregel achteraan, voor de gekozen locatie. De eerstvolgende twee
    // extremen in de volgorde waarin ze komen: soms LW dan HW, soms andersom.
    const getijP = document.createElement("p");
    getijP.className = "bericht getij-regel";
    if (getij.error) {
      getijP.textContent = "Getijgegevens niet beschikbaar.";
    } else {
      const komende = getij.komende?.length
        ? getij.komende
        : [getij.volgendLaagwater, getij.volgendHoogwater]
            .filter(Boolean)
            .sort((a, b) => new Date(a.tijdstip) - new Date(b.tijdstip));
      const delen = komende.map((e) => {
        const label = e.type === "hoogwater" ? "HW" : "LW";
        return `${label}: ${formatTijd(e.tijdstip)}${formatCm(e.waardeCm)}`;
      });
      getijP.textContent = delen.length
        ? `${getij.locatie}, ${delen.join(", ")}`
        : `${getij.locatie}, geen komende getijden bekend.`;
    }
    el.appendChild(getijP);
    document.getElementById("kopieer").disabled = false;
  } catch (err) {
    document.getElementById("kopieer").disabled = true;
    el.className = "status";
    el.textContent = "Kon de gegevens niet ophalen.";
    console.error(err);
  }
}

async function kopieerAlles() {
  // Marifoonbericht en getijregel in één keer, gescheiden door een witregel.
  const status = document.getElementById("kopieer-status");
  const regels = [...document.querySelectorAll("#inhoud p")]
    .map((p) => p.textContent.trim())
    .filter(Boolean);
  if (!regels.length) return;
  const tekst = regels.join("\n\n");

  try {
    await navigator.clipboard.writeText(tekst);
  } catch {
    // Terugval voor browsers of pagina's zonder Clipboard API (bijv. http).
    const veld = document.createElement("textarea");
    veld.value = tekst;
    veld.setAttribute("readonly", "");
    veld.style.position = "fixed";
    veld.style.opacity = "0";
    document.body.appendChild(veld);
    veld.select();
    const gelukt = document.execCommand("copy");
    veld.remove();
    if (!gelukt) {
      status.textContent = "Kopiëren lukte niet. Selecteer de tekst handmatig.";
      return;
    }
  }
  status.textContent = "Gekopieerd";
  clearTimeout(kopieerAlles.timer);
  kopieerAlles.timer = setTimeout(() => (status.textContent = ""), 2500);
}

async function laadDrempel() {
  // Klein los element: wanneer West-Terschelling door NAP +50 cm gaat.
  // Staat los van de locatiekeuze en van de rest van de pagina.
  const el = document.getElementById("drempel");
  try {
    const res = await fetch("/api/drempel");
    if (res.status === 404) throw new Error("api/drempel.js niet gevonden op de server");
    const d = await res.json().catch(() => {
      throw new Error(`geen JSON van /api/drempel (status ${res.status})`);
    });
    if (!res.ok || d.error) throw new Error(d.detail || d.error || `status ${res.status}`);

    const kop = `<strong>NAP ${d.locatie} +${d.niveauCm} cm</strong>`;
    if (!d.komende?.length) {
      el.innerHTML = `${kop}: ${d.nuBoven ? "blijft erboven" : "wordt niet gehaald"} binnen de verwachting.`;
      return;
    }
    const delen = d.komende.map((k) => `${k.richting} ${formatTijd(k.tijdstip)}`);
    el.innerHTML = `${kop}: ${delen.join(", ")}`;
  } catch (err) {
    // De reden staat erbij, zodat je ziet waar het misgaat.
    el.textContent = `NAP West-Terschelling +50 cm: niet beschikbaar (${err.message}).`;
    console.error(err);
  }
}

async function laadWaterstanden() {
  // Rollende balk onderaan met de gemeten standen van waddendata.
  // De inhoud staat er twee keer in, zodat de lus naadloos doorloopt.
  const balk = document.getElementById("ticker");
  const band = document.getElementById("ticker-band");
  try {
    const res = await fetch("/api/waterstanden");
    const d = await res.json();
    if (!res.ok || d.error || !d.locaties?.length) throw new Error(d.detail || d.error || res.status);

    const reeks = document.createDocumentFragment();
    for (const l of d.locaties) {
      const item = document.createElement("span");
      item.className = "ticker-item";
      const naam = document.createElement("b");
      naam.textContent = l.naam;
      item.appendChild(naam);

      const stand = document.createElement("span");
      if (l.waardeCm == null) {
        stand.className = "geen";
        stand.textContent = "geen meting";
      } else {
        const teken = l.waardeCm > 0 ? "+" : l.waardeCm < 0 ? "\u2212" : "";
        stand.textContent = `${teken}${Math.abs(l.waardeCm)} cm`;
      }
      item.appendChild(stand);

      if (l.waardeCm != null && l.richting) {
        const pijl = document.createElement("span");
        pijl.className = "pijl";
        pijl.textContent = l.richting === "stijgend" ? "\u25B2" : "\u25BC";
        pijl.title = l.richting;
        item.appendChild(pijl);
      }
      reeks.appendChild(item);

      const icoon = document.createElement("img");
      icoon.className = "ticker-icoon";
      icoon.src = "https://www.dutchdredging.nl/media/beeldmerk/small/50x50/beeldmerk.png";
      icoon.alt = "";
      reeks.appendChild(icoon);
    }

    const vingerafdruk = JSON.stringify(d.locaties.map((l) => [l.naam, l.waardeCm, l.richting]));
    if (vingerafdruk !== band.dataset.vingerafdruk) {
      band.dataset.vingerafdruk = vingerafdruk;
      band.replaceChildren(reeks.cloneNode(true), reeks);
    }
    balk.hidden = false;
    // Gelijke snelheid ongeacht schermbreedte: ongeveer 50 pixels per seconde.
    requestAnimationFrame(() => {
      band.style.setProperty("--duur", `${Math.max(20, band.scrollWidth / 2 / 50)}s`);
    });
  } catch (err) {
    // Liever geen balk dan een lege of verouderde balk.
    balk.hidden = true;
    console.error("Waterstanden niet beschikbaar:", err);
  }
}

document.getElementById("kopieer").addEventListener("click", kopieerAlles);
// ---------- Automatisch verversen ----------
// Gegevens: elke 10 minuten, zonder de pagina te herladen. Dat is het ritme
// waarin waddendata en onze API-cache vernieuwen; vaker heeft geen zin.
// Browsers vertragen timers in een tabblad op de achtergrond of tijdens
// slaapstand. Daarom verversen we ook meteen als je terugkomt op de pagina
// en de laatste keer langer dan 2 minuten geleden is.
// Daarnaast herlaadt de hele pagina elke 10 minuten, zodat een nieuwe versie
// van je site vanzelf binnenkomt op een scherm dat dag en nacht openstaat.
// De gekozen locatie blijft daarbij bewaard.

const VERVERS_MS = 10 * 60 * 1000;
const TERUGKOMST_MS = 2 * 60 * 1000;
const HERLAAD_MS = 10 * 60 * 1000 - 30 * 1000; // 10 minuten, met een halve minuut marge voor timers die net te vroeg afgaan
const geladenOp = Date.now();
let laatsteVerversing = 0;

function ververs() {
  laatsteVerversing = Date.now();
  laadAlles();
  laadDrempel();
  laadWaterstanden();
}

function bewaarLocatie() {
  try { localStorage.setItem("getijLocatie", document.getElementById("locatie").value); } catch {}
}

function herstelLocatie() {
  try {
    const opgeslagen = localStorage.getItem("getijLocatie");
    const select = document.getElementById("locatie");
    if (opgeslagen && [...select.options].some((o) => o.value === opgeslagen)) {
      select.value = opgeslagen;
    }
  } catch {}
}

document.getElementById("locatie").addEventListener("change", () => {
  bewaarLocatie();
  laadAlles();
});

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  if (Date.now() - geladenOp > HERLAAD_MS) return location.reload();
  if (Date.now() - laatsteVerversing > TERUGKOMST_MS) ververs();
});

setInterval(() => {
  // Volledig herladen alleen als de pagina zichtbaar is; anders gebeurt het
  // bij terugkomst via visibilitychange.
  if (Date.now() - geladenOp > HERLAAD_MS && document.visibilityState === "visible") {
    return location.reload();
  }
  ververs();
}, VERVERS_MS);

herstelLocatie();
ververs();
</script>
</body>
</html>
